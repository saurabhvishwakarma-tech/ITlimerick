add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera is allowed for this site only: organisers scan tickets at the door.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Speaker photos and partner logos are external https links, so img-src allows https:.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
